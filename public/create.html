<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建代币 · 发发 FāFā</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/live.css"><link rel="stylesheet" href="/polish.css"><link rel="stylesheet" href="/create.css"></head><body><header><a class="brand" href="/"><span class="brandmark">发</span> 发发 <span class="latin">FĀFĀ</span></a><nav><a class="nav docs-link" href="/" data-cn="发射台" data-en="Launchpad"></a><a class="nav docs-link active" href="/create" data-cn="创建代币" data-en="Create token"></a><a class="nav docs-link" href="/docs.html" data-cn="文档" data-en="Docs"></a></nav><div class="headright"><button id="lang">中 / EN</button><button class="wallet" id="wallet" data-cn="连接钱包" data-en="Connect wallet"></button></div></header><main class="create-layout"><div class="create-intro"><span class="eyebrow">FROM AN IDEA TO A COMMUNITY</span><h1 data-cn="让你的灵感，<br>成为下一个故事。" data-en="Your idea.<br>A community’s next story."></h1><p data-cn="为你的代币赋予名字、个性与归属。其余的，交给社区。" data-en="Give your token a name, a personality and a place to belong."></p></div><div class="create-steps"><span class="active"><i>01</i><b data-cn="代币资料" data-en="Token identity"></b></span><em></em><span><i>02</i><b data-cn="预览与确认" data-en="Review & sign"></b></span><em></em><span><i>03</i><b data-cn="社区上线" data-en="Go live"></b></span></div><div class="create-grid"><div><section id="launch-success" class="creation-success" hidden><h2 data-cn="代币已创建" data-en="Token created"></h2><p data-cn="本次发射已完成，页面链接已永久绑定到你的代币。" data-en="This launch is complete. Its page is permanently linked to your token."></p><a id="created-link" class="primary" data-icon="globe" data-cn="打开代币页面" data-en="Open token page"></a></section><form id="create-form" class="create-form"><section class="form-section quote-section"><div class="section-heading"><span class="section-index">◎</span><div><h2 data-cn="选择发射配对" data-en="Choose your launch pair"></h2><p data-cn="选择用于买入新代币的资产。" data-en="Choose the asset used to buy your new token."></p></div></div><div class="quote-options"><label class="quote-option"><input type="radio" name="quoteAsset" value="SOL" checked><span><strong>Solana · SOL</strong><small data-cn="原生资产 · Pump.fun 发射" data-en="Native asset · Pump.fun launch"></small></span><b data-cn="可用" data-en="Available"></b></label><label class="quote-option"><input type="radio" name="quoteAsset" value="BABAx"><span><strong data-cn="阿里巴巴 · BABAx" data-en="Alibaba · BABAx"></strong><small data-cn="股票代币配对 · 仅可保存草稿" data-en="Stock-token pair · Draft only"></small></span><b data-cn="未接通" data-en="Not connected"></b></label></div><p id="quote-explanation" role="status"></p><a href="https://assets.backed.fi/products/alibaba-xstock" target="_blank" rel="noopener" class="quote-issuer" data-cn="查看 BABAx 发行方资料" data-en="View BABAx issuer information"></a></section><section class="form-section"><div class="section-heading"><span class="section-index">01</span><div><h2 data-cn="代币形象" data-en="Token identity"></h2><p data-cn="第一印象，从这里开始。" data-en="Make a first impression."></p></div></div><div class="upload-zone" id="upload-zone"><input id="token-image-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Token image"><div id="upload-placeholder"><span data-icon="image" class="upload-icon"></span><strong data-cn="拖拽图片到这里，或点击上传" data-en="Drop an image here, or click to upload"></strong><small data-cn="PNG、JPG 或 WebP · 最大 2 MB · 建议正方形" data-en="PNG, JPG or WebP · Up to 2 MB · Square recommended"></small></div><img id="image-preview" alt="Token image preview" hidden><span class="image-change" id="image-change" hidden data-cn="点击更换图片" data-en="Click to replace"></span></div><div class="field-grid"><div class="field"><label for="token-name" data-cn="代币名称" data-en="Token name"></label><input id="token-name" name="name" required maxlength="32" placeholder="例如：发财猫"><span class="field-help" id="name-count">0 / 32 bytes</span></div><div class="field"><label for="token-symbol"><span data-cn="中文代码" data-en="Chinese ticker"></span><span class="field-badge" data-cn="仅限汉字" data-en="HAN ONLY"></span></label><input id="token-symbol" name="symbol" required placeholder="招财猫" autocomplete="off"><span class="field-help" id="ticker-count">0 / 13 字</span><span class="field-help" id="ticker-help" data-cn="1–13 个汉字，不包含英文字母、数字或符号。" data-en="1–13 Chinese characters. No Latin letters, numbers or symbols."></span></div></div><details class="translation-box"><summary><span data-icon="translate" data-cn="有英文想法？翻译成中文" data-en="Have an English idea? Translate it"></span><span>＋</span></summary><p data-cn="输入简短英文词组，翻译后自行确认代码。" data-en="Enter a short English phrase, then review the Chinese result."></p><div class="translate-input"><input id="english-ticker" maxlength="60" placeholder="Lucky cat" aria-label="English ticker idea"><button type="button" id="translate-ticker" data-icon="translate" data-cn="翻译" data-en="Translate"></button></div><div class="translation-examples" id="translation-examples"></div><div id="translation-result" hidden><span id="translated-text"></span><button type="button" id="apply-translation" data-cn="使用这个代码" data-en="Use this ticker"></button></div><p id="translation-status" role="status"></p></details><div class="field"><label for="token-description" data-cn="代币介绍" data-en="Description"></label><textarea id="token-description" name="description" maxlength="280" rows="4" placeholder="讲讲你的故事，让社区认识你的代币。"></textarea><span class="field-help" id="description-count">0 / 280</span></div></section><section class="form-section"><div class="section-heading"><span class="section-index">02</span><div><h2 data-cn="社区链接" data-en="Community links"></h2><p data-cn="让志同道合的人找到彼此。" data-en="Help your community find each other."></p></div><span class="optional" data-cn="社交链接选填" data-en="SOCIALS OPTIONAL"></span></div><div class="field-grid"><div class="field"><label for="token-twitter" data-icon="x">X / Twitter</label><input id="token-twitter" name="twitter" type="url" placeholder="https://x.com/yourcommunity" maxlength="200"></div><div class="field"><label for="token-telegram" data-icon="message">Telegram</label><input id="token-telegram" name="telegram" type="url" placeholder="https://t.me/yourcommunity" maxlength="200"></div></div><div class="field"><label for="token-website"><span data-icon="globe" data-cn="代币网站" data-en="Token website"></span><span class="locked-badge" data-icon="lock" data-cn="永久绑定" data-en="PERMANENT LINK"></span></label><div class="locked-url"><input id="token-website" readonly aria-readonly="true"><button id="copy-website" type="button" data-icon="copy" aria-label="Copy token website"></button></div><span class="field-help" data-cn="自动绑定到当前代币的专属页面，无法修改为其他网址。页面在链上确认后开放。" data-en="Automatically bound to this token’s page. Cannot be replaced with another URL. Opens after onchain confirmation."></span></div></section><section class="form-bottom"><div class="connection-note" id="create-connection"></div><p id="create-error" role="alert" class="error" hidden></p><div class="create-actions"><button type="button" id="save-draft" data-icon="file" data-cn="保存草稿" data-en="Save draft"></button><button type="submit" class="primary" id="prepare-launch" data-icon="launch" data-cn="预览发射" data-en="Review launch"></button></div><p class="form-disclaimer" data-cn="发射前审核全部资料。元数据发布后不可修改；签名后会产生真实主网交易。" data-en="Review all details before launch. Published metadata cannot be edited; wallet signing submits a real mainnet transaction."></p></section></form></div><aside class="create-preview"><div class="preview-label"><span data-cn="实时预览" data-en="LIVE PREVIEW"></span><span>✦</span></div><article class="preview-token"><div class="preview-cover"><span>FĀFĀ / SOLANA</span><div id="preview-avatar" data-icon="spark"></div><span class="preview-motif">发</span></div><div class="preview-body"><span class="badge" id="preview-pair">PUMP.FUN · SOL</span><h2 id="preview-name">你的代币</h2><p class="preview-symbol" id="preview-symbol">$代码</p><p id="preview-description"></p><div class="preview-socials" id="preview-socials"></div><div class="preview-footer" data-icon="shield" data-cn="钱包签名 · 自主掌控" data-en="Wallet signed · Your control"></div></div></article><div class="launch-facts"><div><span data-cn="发射协议" data-en="Launch protocol"></span><strong id="quote-protocol">Pump.fun</strong></div><div><span data-cn="配对资产" data-en="Quote asset"></span><strong id="quote-asset-label">SOL</strong></div><div><span data-cn="元数据" data-en="Metadata"></span><strong data-cn="发布后锁定" data-en="Locked on publication"></strong></div><div><span data-cn="网站" data-en="Website"></span><strong data-cn="专属代币页面" data-en="Dedicated token page"></strong></div></div><p class="preview-note" data-cn="预览不代表已发行。只有链上确认成功后，你的代币才会出现在发射台。" data-en="A preview is not an issued token. Your token appears on the launchpad only after onchain confirmation."></p></aside></div></main><footer><a class="brand" href="/">发发 <span class="latin">FĀFĀ</span></a><span data-cn="好梗无界，灵感上链。" data-en="Good memes travel. Great ideas go onchain."></span></footer><dialog id="modal"><button class="close" aria-label="Close">×</button><div id="modalbody"></div></dialog><div id="toast" role="status"></div><script type="module" src="/create.js"></script><script type="module" src="/ui.js"></script></body></html>
