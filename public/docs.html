<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发发 · Docs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="live.css"><link rel="stylesheet" href="/polish.css"></head><body><header><a class="brand" href="./"><span class="brandmark">发</span>发发 <span class="latin">FĀFĀ</span></a><div class="headright"><button id="motion" aria-label="Pause animations">Ⅱ</button><button id="lang">中 / EN</button><a class="wallet" href="./" data-cn="返回发射台 " data-en="Launchpad "></a></div></header><main class="doc-body"><span class="eyebrow">PUMP.FUN / SOLANA</span><h1 data-cn="发射指南。" data-en="The launch guide."></h1><div data-cn="<h2>01 · 连接与登录</h2><p>支持 Phantom 与 Solflare 浏览器钱包。登录需要签名一条包含网站域名、钱包地址和一次性随机数的消息，不是资产转账。草稿、自选及订单记录保存到你的钱包账户。</p><h2>02 · 创建代币</h2><p>填写名称、代码、介绍并上传 PNG、JPEG 或 WebP 图片。名称最多 32 个 UTF-8 字节；新代码仅接受 1–3 个汉字，最多 10 个 UTF-8 字节。可添加 X 与 Telegram 社区链接，网站字段锁定为当前 mint 的永久代币页面。提供英文到中文命名辅助（自由翻译需配置服务），使用前请确认含义。当前创建 SOL 配对的普通 Pump.fun 代币，创建者为你的钱包。图片与元数据由此网站和数据库持久托管。</p><p>先构建并模拟，再展示交易供你确认。钱包批准后才提交主网。需要 SOL 支付网络费用与账户租金；创建成功以链上 confirmed 状态为准。</p><h2>03 · 曲线交易与兑换</h2><p>输入完整 Pump mint 地址可读取链上曲线信息。买入输入 SOL 数量，卖出输入代币数量。预览会显示预计输出、滑点与交易限额。已毕业币需要可用的 Jupiter 路由与部署方允许的 mint。</p><p>兑换区使用 Jupiter。默认允许 SOL / USDC；当前金额输入为最小原子单位，1 SOL = 1000000000，1 USDC = 1000000。提交前务必核对报价和 mint 地址。</p><h2>04 · 股票代币</h2><p>股票代币暂未开放交易。BABAx 需要完成具体资产与发行方要求核验；腾讯、京东和百度仍是拟议标的。股票代币不等于直接持股，也不是本版 Pump 发射的配对资产。</p><h2>05 · 交易状态</h2><p>prepared 表示已准备但未发送；submitting 表示提交中或提交结果不确定；submitted 表示已广播；confirmed 表示链上确认；failed 或 expired 表示失败或过期。遇到网络错误，先从钱包菜单打开交易记录检查状态，不要立即重复下单。</p><h2>06 · 当前版本</h2><p>此版本已实现后端与交易构建，但没有完成真实资金端到端验收或独立安全审计。部署配置默认关闭主网交易。不存在演示市值或伪造订单，首页只列出本站已确认发射。</p><p>代币独立页面提供已加载链上成交的 K 线图与每 15 秒刷新的成交记录。完整历史索引、直接 PumpSwap 交易和股票资格验证仍未实现。移动端支持钱包内置浏览器，尚无通用深链流程。</p><h2>07 · 数据与动画</h2><p>元数据和图片一旦发布即不再修改，依赖网站域名与数据库持续可用。站内语言与动画偏好保存在浏览器；可以点击 Ⅱ 暂停动画，网站也遵循系统减少动态效果设置。</p>" data-en="<h2>01 · Connect and sign in</h2><p>Phantom and Solflare browser wallets are supported. Sign-in requests a message containing this site's domain, your wallet address and a one-time nonce, not a transfer. Drafts, watchlists and order history are stored against your wallet account.</p><h2>02 · Create a coin</h2><p>Add a name, ticker, description and a PNG, JPEG or WebP image. Names allow up to 32 UTF-8 bytes; new tickers use 1–3 Chinese Han characters, up to 10 UTF-8 bytes. Optional X and Telegram community links are supported. The website field is locked to the permanent page for this mint. English-to-Chinese naming assistance is available (free-form translation requires provider configuration); review suggestions before applying them. This release creates standard SOL-paired Pump.fun coins with your wallet as creator. Images and metadata are persistently hosted by this site and its database.</p><p>The server builds and simulates a transaction before showing a review. Only wallet approval submits to mainnet. Network fees and account rent require SOL. A launch succeeds only after onchain confirmation.</p><h2>03 · Curve trading and swaps</h2><p>Enter an exact Pump mint address to inspect its onchain curve. Buys take a SOL amount; sells take token units. Review estimated output, slippage and transaction limits. Graduated coins require an available Jupiter route and an operator-allowed mint.</p><p>The swap section uses Jupiter, with SOL / USDC allowed by default. Its amount field currently uses atomic units: 1 SOL = 1000000000; 1 USDC = 1000000. Verify amounts and mint addresses before signing.</p><h2>04 · Stock tokens</h2><p>Stock trading is not enabled. BABAx still requires specific asset and issuer-requirement verification; Tencent, JD and Baidu remain proposed assets. Stock tokens are not direct share ownership or quote assets for this release's Pump launches.</p><h2>05 · Order states</h2><p>prepared means not sent; submitting means submission is in progress or uncertain; submitted means broadcast; confirmed means confirmed onchain; failed or expired means unsuccessful or expired. After a network error, open Order history from the wallet menu and check status before placing another order.</p><h2>06 · Release status</h2><p>Backend and transaction construction are implemented, but real-money end-to-end acceptance and an independent security audit are incomplete. Mainnet transactions are disabled by default. The catalogue displays only confirmed site launches, with no fabricated prices or orders.</p><p>Dedicated token pages show candlesticks from loaded onchain trades and a feed refreshed every 15 seconds. A complete historical index, direct PumpSwap trading and stock eligibility controls remain unimplemented. Mobile supports in-wallet browsers; universal deep links are not implemented.</p><h2>07 · Data and motion</h2><p>Published metadata and images are immutable and rely on this domain and database remaining available. Language and motion preferences stay in your browser. Use Ⅱ to pause animation; system reduced-motion preferences are respected.</p>"></div><p><a href="https://github.com/pump-fun/pump-public-docs" target="_blank" rel="noopener">Pump.fun docs </a> · <a href="https://developers.jup.ag/docs/swap/order-and-execute" target="_blank" rel="noopener">Jupiter docs </a></p></main><script src="docs-live.js"></script><script src="motion.js"></script><script type="module" src="/ui.js"></script></body></html>
