[package]
name = "fafa-red-envelope"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fafa_red_envelope"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "orao-solana-vrf/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["associated_token", "token_2022"] }
orao-solana-vrf = { version = "=0.7.0", default-features = false, features = ["cpi"] }

solana-sha256-hasher = "=2.3.0"

solana-curve25519 = "=2.3.13"
